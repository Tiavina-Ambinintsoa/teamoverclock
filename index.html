<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0e7490" />

    <!-- TODO(webcup) : titre, description et image de partage (URLs ABSOLUES pour Facebook/WhatsApp/LinkedIn) -->
    <title>Nova Terra — Portail de la ville futuriste</title>
    <meta name="description" content="Portail citoyen de Nova Terra, ville fictive et futuriste : démarches, services, actualités, carte interactive, signalements et assistant vocal." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nova Terra — Portail de la ville futuriste" />
    <meta property="og:description" content="Démarches, services, carte en ruche, signalements et alertes de Nova Terra (ville fictive)." />
    <meta property="og:image" content="https://VOTRE-URL/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Applique le thème AVANT le premier affichage : évite le flash blanc en mode sombre. -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem("webcup:mode") || "system"
          var preset = localStorage.getItem("webcup:preset:v2") || "nova-terra"
          var typography = localStorage.getItem("webcup:typography") || "theme"
          var morphism = localStorage.getItem("webcup:morphism") || "standard"
          var dark = preset === "nova-terra" || mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          var root = document.documentElement
          root.dataset.theme = preset
          root.dataset.typography = ["theme", "instrument", "bricolage", "fraunces", "system"].includes(typography) ? typography : "theme"
          root.dataset.morphism = ["standard", "glass", "clay", "skeuomorphic", "neumorphic", "minimal", "neo-brutalist", "liquid-glass"].includes(morphism) ? morphism : "standard"
          root.classList.toggle("dark", dark)
          // Préférences d'accessibilité (mal voyant) : contraste et taille de texte dès le premier affichage.
          var a11y = JSON.parse(localStorage.getItem("webcup:a11y") || "null")
          if (a11y && typeof a11y === "object") {
            var themes = ["high_contrast_light", "high_contrast_dark", "yellow_on_black"]
            if (themes.indexOf(a11y.theme) !== -1) {
              root.dataset.contrast = a11y.theme
              root.classList.toggle("dark", a11y.theme !== "high_contrast_light")
            }
            var scale = Number(a11y.fontScale)
            if (scale >= 0.85 && scale <= 2 && scale !== 1) root.style.fontSize = scale * 100 + "%"
            if (a11y.reduceMotion === true) root.dataset.reduceMotion = "true"
            var spacing = Number(a11y.lineSpacing)
            if (spacing > 1 && spacing <= 2) {
              root.style.setProperty("--a11y-line-spacing", String(spacing))
              root.dataset.a11yLineSpacing = "on"
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
